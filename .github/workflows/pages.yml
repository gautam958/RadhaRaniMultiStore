name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_SHOP_NAME: ${{ vars.SHOP_NAME || 'Radha Rani Multi Store' }}
          VITE_SHOP_ADDRESS: ${{ vars.SHOP_ADDRESS || 'Deoghar, Jharkhand' }}
          VITE_SHOP_PHONE: ${{ vars.SHOP_PHONE }}
          VITE_SHOP_GSTIN: ${{ vars.SHOP_GSTIN }}
          VITE_UPI_ID: ${{ vars.UPI_ID }}
      # Single-page app: GitHub Pages serves 404.html for deep links like /RadhaRaniMultiStore/pos
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
